<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小青 · 企业员工服务台测试页</title>
  <style>
    :root {
      --blue: #1677ff;
      --text: #1f2329;
      --muted: #646a73;
      --bg: #f2f3f5;
      --card: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: min(420px, 100%);
      padding: 40px 32px 36px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(31, 35, 41, 0.08);
      text-align: center;
    }

    .avatar {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: var(--blue);
      color: #fff;
      font-size: 32px;
      font-weight: 600;
      line-height: 72px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .lead {
      margin: 28px 0 0;
      font-size: 16px;
      line-height: 1.7;
    }

    .note {
      margin: 12px 0 0;
      font-size: 15px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar" aria-hidden="true">青</div>
    <h1>小青</h1>
    <p class="subtitle">企业员工服务台测试页</p>
    <p class="lead">这是 GitHub Pages 托管测试页。</p>
    <p class="note">如果你能看到这一页，说明钉钉没有拦截这个 GitHub 域名。</p>
    <p class="note">进对话请在钉钉顶部搜索「小青」。</p>
  </main>
</body>
</html>
